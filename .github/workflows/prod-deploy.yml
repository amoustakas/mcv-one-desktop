# Pre-merge migration gate for mcv-one-desktop
#
# This workflow exists to protect the `feedback_end_to_end_runtime_verification.md`
# invariant: a feature is not "landed" until its migration is applied to the
# remote database. Local `supabase/migration-*.sql` files greater than the count
# applied on the remote instance would create a runtime split the moment master
# auto-deploys via Vercel's Git integration.
#
# This workflow USED to also contain a `deploy-prod` job that ran Vercel CLI
# against a stored `VERCEL_TOKEN`. That was redundant with Vercel's Git
# integration (the GitHub App, which already watches `master` and deploys
# automatically) and it never had secrets configured — it failed on every
# master push since inception. Removed 2026-04-24 as part of
# `workspace-migration-pnpm-2026-04-24` (PR #70). Per the Vercel platform
# guidance: prefer platform-native integrations before custom infrastructure.
#
# Required GitHub secrets for enforcement:
#   SUPABASE_DB_HOST      — e.g. aws-0-us-west-2.pooler.supabase.com
#   SUPABASE_DB_PASSWORD  — Postgres password for the project's `postgres` role
#
# Without these secrets the job short-circuits to a warning — PR merges are
# never blocked by a missing-secret misconfiguration. The migration gate is
# opt-in; the deploy is always on via Vercel's Git integration.

name: Pre-merge Migration Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: migration-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: Verify Supabase migrations are applied
    runs-on: ubuntu-latest
    env:
      # Secrets piped through env for use in step-level `if:` conditionals.
      # Direct `secrets.*` references in `if:` are documented-supported but
      # have had surprising edge cases; env-var indirection is the universally
      # portable pattern.
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count local migrations
        id: local
        run: |
          count=$(ls supabase/migration-*.sql 2>/dev/null | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Found $count local migration files"

      - name: Short-circuit if DB secrets missing (advisory only)
        id: gate
        run: |
          if [ -z "${SUPABASE_DB_HOST}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::warning::SUPABASE_DB_HOST / SUPABASE_DB_PASSWORD not configured. Migration gate is advisory-only for this run. Configure the secrets in Settings → Secrets and variables → Actions to enforce the gate."
            echo "enforce=false" >> $GITHUB_OUTPUT
          else
            echo "enforce=true" >> $GITHUB_OUTPUT
          fi

      - name: Count applied migrations in Supabase
        id: remote
        if: ${{ steps.gate.outputs.enforce == 'true' }}
        env:
          PGHOST: ${{ env.SUPABASE_DB_HOST }}
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
          PGPORT: 6543
        run: |
          count=$(psql -tAc "SELECT count(*) FROM supabase_migrations.schema_migrations")
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Remote applied: $count"

      - name: Verify migrations are applied
        if: ${{ steps.gate.outputs.enforce == 'true' }}
        run: |
          if [ "${{ steps.local.outputs.count }}" -gt "${{ steps.remote.outputs.count }}" ]; then
            echo "::error::Local has ${{ steps.local.outputs.count }} migration files but Supabase has only ${{ steps.remote.outputs.count }} applied. Apply migrations via the Supabase MCP before merging to master."
            exit 1
          fi
          echo "✓ Migrations verified: local=${{ steps.local.outputs.count }} remote=${{ steps.remote.outputs.count }}"
