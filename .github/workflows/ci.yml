name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node's `cache: pnpm`
      # can locate the pnpm binary. Version pinned via root package.json's
      # packageManager field (pnpm@9.15.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # pnpm's lockfile is platform-independent (content-addressable store
      # doesn't vary by OS), so --frozen-lockfile works cross-platform even
      # when the lockfile was generated on Windows. This supersedes the
      # npm-era `install-not-ci` workaround for Windows→Ubuntu drift.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint is non-blocking while we work through the ~3.2k pre-existing ESLint
      # errors that accumulated before the primary pipeline ever successfully
      # executed. Remove continue-on-error once lint is clean.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Build (tsc -b + vite build — real typecheck gate)
        run: pnpm run build

      - name: Test
        env:
          NODE_ENV: test
        run: pnpm test
