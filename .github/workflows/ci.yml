name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # npm install (not npm ci) — the lockfile is generated on Windows and
      # misses some Linux-only optional deps (@emnapi/runtime, utf-8-validate,
      # etc.) that CI's Ubuntu runner needs. `npm install` tolerates the
      # mismatch; `npm ci` rejects it. Revisit once lockfile generation is
      # moved to a Linux runner.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # Lint is non-blocking while we work through the ~3.2k pre-existing ESLint
      # errors that accumulated before the primary pipeline ever successfully
      # executed (PR #58 introduced pnpm-backed CI that died at install, so lint
      # never actually gated merges). Remove continue-on-error once lint is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build (tsc -b + vite build — real typecheck gate)
        run: npm run build

      - name: Test
        env:
          NODE_ENV: test
        run: npm test
